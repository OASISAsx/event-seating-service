apiVersion: v1
kind: Service
metadata:
  name: mongo-0
  labels:
    app: mongo
spec:
  clusterIP: None
  selector:
    statefulset.kubernetes.io/pod-name: mongo-0
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  labels:
    app: mongo
spec:
  type: NodePort # เปลี่ยนจาก ClusterIP เป็น NodePort
  ports:
    - port: 27017
      targetPort: 27017
      nodePort: 30017 # กำหนดพอร์ตที่จะเข้าจากข้างนอก (เลือกได้ 30000-32767)
  selector:
    app: mongo
