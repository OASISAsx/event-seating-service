apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'false' # ห้าม Redirect ไป HTTPS
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'false' # ห้ามบังคับ SSL
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP' # คุยกับ Backend ด้วย HTTP
spec:
  ingressClassName: nginx
  rules:
    - host: api.event-seat.elitefund.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
