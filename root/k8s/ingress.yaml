# ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  # ลบ rewrite-target ออกเพื่อให้ /api ส่งไปถึง Backend จริงๆ
spec:
  ingressClassName: nginx
  rules:
    - host: api.event-seat.elitefund.fun
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
