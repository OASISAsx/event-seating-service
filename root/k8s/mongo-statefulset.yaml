apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          # --- เพิ่มบรรทัดด้านล่างนี้ ---
          command: ['mongod', '--bind_ip_all', '--replSet', 'rs0']
          # ------------------------
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: manual
        resources:
          requests:
            storage: 5Gi
