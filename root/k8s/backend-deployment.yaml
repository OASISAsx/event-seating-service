apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 2 # รัน 2 Pods เพื่อทำ Load Balancing
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1 # ระหว่างอัปเดต ยอมให้มี Pod เกินมาได้ 1 ตัว (รวมเป็น 3)
      maxUnavailable: 0 # ห้ามปิดตัวเก่าจนกว่าตัวใหม่จะรันได้ 100% (กันเว็บล่ม)
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: oasisforsaken/eventseat-backend:latest
          imagePullPolicy: Always # บังคับให้ดึง Image ใหม่จาก Docker Hub ทุกครั้งที่ Deploy
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: '3001'
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              value: mongodb://mongo:27017/event_service
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
            - name: REDIS_URL
              value: redis://redis:6379
            - name: REDIS_MAX_MESSAGES
              value: '1000'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'

          # ตรวจสอบว่าแอปยัง "มีชีวิต" อยู่ไหม (ถ้าค้าง ให้ Restart)
          livenessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10

          # ตรวจสอบว่าแอป "พร้อมรับลูกค้า" หรือยัง (ถ้าผ่าน Load Balancer ถึงจะส่งงานให้)
          readinessProbe:
            httpGet:
              path: /api
              port: 3001
            initialDelaySeconds: 15 # ลดลงจาก 20 เพื่อให้สลับเวอร์ชันไวขึ้น
            periodSeconds: 5

      restartPolicy: Always
