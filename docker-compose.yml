services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventSeat-backend-1
    ports:
      - '3002:3001'
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=mongodb://mongo:27017/mydb?replicaSet=rs0
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventSeat-rabbitmq-1
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - eventSeat_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mongo:
    image: mongo:7
    container_name: eventSeat-mongo-1
    ports:
      - '27017:27017'
    command: ['--replSet', 'rs0', '--bind_ip_all'] # ✅ เพิ่มตรงนี้
    volumes:
      - eventSeat_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: eventSeat-redis-1
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - eventSeat_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  eventSeat_mongo_data:
  eventSeat_rabbitmq_data:
  eventSeat_redis_data:
