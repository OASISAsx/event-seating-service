services:
  backend:
    image: ghcr.io/oasisasx/event-seating-service:build
    container_name: eventSeat-backend-1
    ports:
      - '3002:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/mydb
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: eventSeat-mongo-1
    ports:
      - '27018:27017'
    volumes:
      - eventSeat_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  eventSeat_mongo_data:
